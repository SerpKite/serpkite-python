# Mirrored from the SerpKite monorepo (sdks/python); edits here are overwritten.
# The monorepo's sdk-mirror workflow pushes tag vX.Y.Z here; this publishes PyPI `serpkite`.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # PyPI trusted publisher: repo SerpKite/serpkite-python, workflow release.yml, environment pypi.
    environment: pypi
    permissions:
      contents: write # GitHub release
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Tag matches pyproject and __version__
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "${TAG#v}" = "$(uv version --short)"
          grep -q "^__version__ = \"${TAG#v}\"" src/serpkite/_version.py
      - run: uv sync --locked && uv run pytest -q
      - run: uv build --out-dir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" dist/*
