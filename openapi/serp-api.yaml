    PlaceResult:
      type: object
      required: [position, title]
      properties:
        position: { type: integer }
        title: { type: string }
        address: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        rating: { type: number }
        rating_count: { type: integer }
        price_level: { type: string }
        type: { type: string }
        types: { type: array, items: { type: string } }
        website: { type: string }
        phone_number: { type: string }
        international_phone_number: { type: string, examples: ["+44 20 7232 3010"] }
        opening_hours:
          type: object
          additionalProperties: { type: string }
          description: 'Hours as the provider displays them, keyed by English weekday (Monday … Sunday), in `language`, e.g. {"Monday": "7:30 am–6 pm", "Sunday": "Closed"}; Yandex Maps: 24-hour times ("08:00–22:00"), "Closed"/"выходной", "Open 24 hours"/"круглосуточно"'
        weekly_hours: { $ref: "#/components/schemas/WeeklyHours" }
        country: { type: string, description: "ISO 3166-1 alpha-2 country code of the place, upper case (RU, GB)" }
        timezone: { type: string, description: IANA time zone of the place (Europe/Moscow) }
        description: { type: string, description: "Google's short description of the place, or the owner's, when Google shows one; Yandex Maps' summary of the place when it has one" }
        photos:
          type: array
          description: Photos of the place (/v1/place; up to 10). The URLs are public and can be fetched server-side without cookies
          items: { $ref: "#/components/schemas/PlacePhoto" }
        google_maps_url: { type: string, description: The place on Google Maps }
        thumbnail_url: { type: string }
        place_id: { type: string }
        cid: { type: string }
        fid: { type: string }
        oid: { type: string, description: "Yandex Maps organisation id (engine=yandex), for /v1/place" }
        yandex_maps_url: { type: string, description: "The place on Yandex Maps (engine=yandex): https://yandex.ru/maps/org/<oid>/" }
    WeeklyHours:
      type: object
      description: |
        Opening hours per weekday, from the provider's listing, as local times (`timezone`) in 24-hour HH:MM.
        A day that is closed is an empty list; a day open 24 hours is `[{"open": "00:00", "close": "24:00"}]`;
        a day with a break has several intervals. `close` is "24:00" at midnight, and an interval that
        ends after midnight has `next_day: true` (e.g. 17:30–03:00). Days Google doesn't list are absent;
        Yandex Maps lists all seven or none.
      properties:
        monday: { $ref: "#/components/schemas/HoursIntervals" }
        tuesday: { $ref: "#/components/schemas/HoursIntervals" }
        wednesday: { $ref: "#/components/schemas/HoursIntervals" }
        thursday: { $ref: "#/components/schemas/HoursIntervals" }
        friday: { $ref: "#/components/schemas/HoursIntervals" }
        saturday: { $ref: "#/components/schemas/HoursIntervals" }
        sunday: { $ref: "#/components/schemas/HoursIntervals" }
    HoursIntervals:
      type: array
      items: { $ref: "#/components/schemas/HoursInterval" }
    HoursInterval:
      type: object
      required: [open, close]
      properties:
        open: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$", examples: ["08:00"] }
        close: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$", examples: ["22:00"] }
        next_day: { type: boolean, description: "The interval closes after midnight, on the next day" }
    PlacePhoto:
      type: object
      required: [url]
      properties:
        url: { type: string, description: "Image URL (at most 1600 px on the long side)" }
        width: { type: integer }
        height: { type: integer }
        source: { type: string, enum: [business, visitor], description: "Who uploaded it, when Google says (Google shows no contributor names to logged-out visitors)" }
    PlacesResponse:
      type: object
      required: [request, results, meta]
