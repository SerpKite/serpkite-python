openapi: 3.1.0
info:
  title: SerpKite SERP API
  version: 1.12.1
  description: |
    Public search API (api.serpkite.com). Google results as clean JSON or Markdown
    for AI agents, plus a Google Custom Search–compatible endpoint. Official SDKs:
    `serpkite` on npm and PyPI, `github.com/serpkite/serpkite-go`.

    **Auth:** `Authorization: Bearer skt_live_…`. A bare `Authorization: skt_live_…`
    (no scheme) is also accepted, for MCP hosts that can't add one. GET requests
    may pass `?api_key=` instead. `/customsearch/v1` also accepts Google's `?key=`.

    **Bodies:** every vertical accepts `POST` with a JSON object or `GET` with the
    same parameters in the query string (only `GET /v1/search` is spelled out
    here). Unknown parameters are rejected with 400, and so is a parameter the
    endpoint would ignore (e.g. `time` on `/v1/scholar`, `ll` on `/v1/search`). To run many queries at once,
    use `POST /v1/batches`.

    **Formats:** `format=json` (default) returns the schemas below.
    `format=markdown` returns `text/markdown` for every vertical.
    `format=compact` and `fields=` return a reduced JSON object (same top-level
    keys, fewer item fields, `meta` always kept), so required item fields may be
    absent there.

    **Responses** share one envelope: `request` (the normalised request),
    `results` (the vertical's primary list), vertical-specific extras and `meta`.
    All keys are snake_case.

    **Credits** are decimal numbers (e.g. `0.5`). Failed, empty and blocked
    responses are refunded. Every billed response carries `X-Credits-Used`,
    `X-Credits-Remaining`, `X-Cost-USD`, `X-Cache` (`HIT`|`MISS`), `X-Latency-Ms`,
    `X-Tokens-Estimate` and `X-Request-Id`.

    **Errors** share one body: `{"error":{"code","message","request_id"}}`.
    Upstream failures (`upstream_error`, `upstream_blocked`, `upstream_timeout`)
    are `503` with `Retry-After`, never billed and safe to retry. The API never
    returns `502` or `504`. `429` also carries `Retry-After`: `rate_limited` is
    the per-second limit; `daily_limit_reached` is the free daily limit of an
    account that never bought a pack, which resets at 00:00 UTC (the message
    names the limit and the billing page; buying any pack removes it).

    **CORS:** `Access-Control-Allow-Origin: *` without credentials; the `X-*`
    headers above are exposed, so a browser playground can call the API with a key.
    The keyless `/playground/search` is the exception: it only answers serpkite.com
    and app.serpkite.com (other `Origin`s get 403).

    Credit table: search/news/images/videos/maps/places/shopping/scholar/patents/
    webpage/customsearch = 1 per page; place details = 1; `num=100` depth bundle = 7; reviews = 1 per 10;
    autocomplete = 0.5; `include_content` = +1 per fetched page;
    batches ×0.5 (from 2026-11-23 a batch depth request is 0.5 per page with
    results, without the bundle cap: `num=100` = 5); cache hit via `max_age` ×0.5. `engine=consensus` (search only) =
    the sum of one page per provider that returned results.

    **AI** (Claude writes, OpenAI's Decisions API runs typed checks; a failed
    model step is never billed): an answer (`include_answer` on `/v1/search` and
    `/v1/news`, the model part of `/v1/answer`) = +2 over the result page, +4
    when it read pages (`include_content`, `/v1/answer` depth=standard);
    `/v1/extract` `summary` = +4 and `output_schema` = +4 per page;
    `/v1/research` = lite 30, standard 75, deep 200. Responses that used a
    model carry `meta.llm`.

    **AI assistants** (`/v1/chatgpt`, `/v1/gemini`, `/v1/copilot`,
    `/v1/ai_mode`, `/v1/brave_ai`): a `prompt` sent to the public assistant
    as a logged-out user, through our proxies; the response is its answer
    (`text`, `markdown`) with the `sources` it cited or listed,
    `search_queries`, `products` and `places` where the assistant shows them,
    and `mentions` for the brands and domains in `track`. ChatGPT 5, Gemini 5,
    Copilot 3, AI Mode 3, Brave AI 2 credits per answer, the same in batches;
    a cache hit (`max_age`) ×0.5; failed, refused and empty answers are free.
    Answers take 10–90 s: run many through `POST /v1/batches` or a monitor.
servers:
  - url: https://api.serpkite.com
  - url: http://localhost:8080
security:
  - bearer: []
paths:
  /healthz:
    get:
      summary: Readiness (DB, Valkey)
      security: []
      responses:
        "200": { description: OK }
        "503": { description: A dependency is down }
  /livez:
    get:
      summary: Liveness only
      security: []
      responses:
        "200": { description: OK }

  /v1/search:
    post:
      summary: Google web search (organic results, knowledge graph, answer box, people also ask, top stories, local pack…)
      operationId: search
      requestBody: { $ref: "#/components/requestBodies/Search" }
      responses:
        "200": { $ref: "#/components/responses/SearchOK" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
    get:
      summary: Same as POST /v1/search with query-string parameters
      operationId: searchGet
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: country, in: query, schema: { type: string } }
        - { name: language, in: query, schema: { type: string } }
        - { name: location, in: query, schema: { type: string } }
        - { name: num, in: query, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: uule, in: query, schema: { type: string } }
        - { name: ll, in: query, schema: { type: string } }
        - { name: time, in: query, schema: { type: string } }
        - { name: tbs, in: query, schema: { type: string } }
        - { name: device, in: query, schema: { type: string } }
        - { name: safe, in: query, schema: { type: string } }
        - { name: autocorrect, in: query, schema: { type: boolean } }
        - { name: format, in: query, schema: { type: string } }
        - { name: fields, in: query, schema: { type: string } }
        - { name: include_content, in: query, schema: { type: integer } }
        - { name: ads, in: query, schema: { type: boolean } }
        - { name: max_age, in: query, schema: { type: integer } }
        - { name: engine, in: query, schema: { type: string }, description: "google (default), auto, consensus, one provider, or a comma-separated list (e.g. google,brave)" }
        - { name: include_domains, in: query, schema: { type: string }, description: "Comma-separated domains, or the key repeated (see SearchRequest.include_domains)" }
        - { name: exclude_domains, in: query, schema: { type: string }, description: "Comma-separated domains, or the key repeated" }
        - { name: boost_domains, in: query, schema: { type: string }, description: "Comma-separated domains, or the key repeated" }
        - { name: start_date, in: query, schema: { type: string, format: date } }
        - { name: end_date, in: query, schema: { type: string, format: date } }
        - { name: highlights, in: query, schema: { type: boolean }, description: Needs include_content }
        - { name: include_answer, in: query, schema: { type: boolean }, description: Add a cited AI answer (+2 credits; +4 with include_content) }
        - { name: api_key, in: query, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/SearchOK" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/images:
    post:
      summary: Google Images
      description: "One page is a block of up to 100 images for 1 credit; page 2 starts at position 101. `num` returns only the first `num` images of the page (same credit). A page past the last one returns empty `results`, free."
      operationId: images
      requestBody: { $ref: "#/components/requestBodies/Search" }
      responses:
        "200": { $ref: "#/components/responses/ImagesOK" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/videos:
    post:
      summary: Google Videos
      operationId: videos
      requestBody: { $ref: "#/components/requestBodies/Search" }
      responses:
        "200": { $ref: "#/components/responses/VideosOK" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/news:
    post:
      summary: Google News
      operationId: news
      requestBody: { $ref: "#/components/requestBodies/Search" }
      responses:
        "200": { $ref: "#/components/responses/NewsOK" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/maps:
    post:
      summary: Google Maps search (places with coordinates). Accepts `ll` ("@lat,lng,zoomz") to search around a point
      operationId: maps
      description: |
        Google Maps search results: name, full address, coordinates, categories, rating, website,
        phone, opening hours and the place's identifiers (`place_id`, `cid`, `fid`) for
        `/v1/place` and `/v1/reviews`. Categories, addresses and hours are in `language`.

        **Where:** `ll` ("@lat,lng,zoomz") searches the map at that point and zoom; `location`
        (or `uule`) searches the named place. Without either, Google picks the area from the
        query (an exact name or address) or from where the request comes from, so local queries
        such as "coffee" need `location` or `ll`.

        **Yandex Maps:** with `engine=yandex` (where the deployment enables it) the results come
        from Yandex Maps, which covers Russia and the CIS in depth. They have the same fields,
        with the Yandex organisation id in `oid` (for `/v1/place`) and `yandex_maps_url` instead
        of Google's identifiers; categories, addresses and hours follow `language` (`ru` for
        Russian). Pass `ll` or a `location` (a city, appended to the query); `uule` and `tbs`
        are refused.
      requestBody: { $ref: "#/components/requestBodies/Search" }
      responses:
        "200": { $ref: "#/components/responses/PlacesOK" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/places:
    post:
      summary: Google local results (places)
      operationId: places
      description: Same results as `/v1/maps` (Google Maps search), with the same fields and location rules.
      requestBody: { $ref: "#/components/requestBodies/Search" }
      responses:
        "200": { $ref: "#/components/responses/PlacesOK" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/place:
    post:
      summary: Details of one place (by `place_id`, `cid`, `fid` or Yandex `oid`); 1 credit
      operationId: place
      description: |
        The full Google Maps listing of one place: address, country, coordinates, time zone,
        categories, opening hours (as text and as structured `weekly_hours`), website, phone,
        rating, description and photos, in `language`. `results` holds the place, or is empty
        (not charged) when no place has that identifier.

        With `oid` (a Yandex Maps organisation id, e.g. from an `engine=yandex` maps result or
        `yandex.ru/maps/org/<name>/<oid>/`) the listing comes from Yandex Maps, where the
        deployment enables it: `oid` implies `engine=yandex` and can't be combined with Google's
        identifiers. Closed listings (temporarily or permanently) carry no hours.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaceRequest" }
      responses:
        "200": { $ref: "#/components/responses/PlacesOK" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/reviews:
    post:
      summary: Reviews of a place (by `place_id`, `cid` or `fid`); 1 credit per 10 reviews
      operationId: reviews
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewsRequest" }
      responses:
        "200": { $ref: "#/components/responses/ReviewsOK" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/shopping:
    post:
      summary: Google Shopping
      operationId: shopping
      requestBody: { $ref: "#/components/requestBodies/Search" }
      responses:
        "200": { $ref: "#/components/responses/ShoppingOK" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/scholar:
    post:
      summary: Google Scholar
      operationId: scholar
      requestBody: { $ref: "#/components/requestBodies/Search" }
      responses:
        "200": { $ref: "#/components/responses/ScholarOK" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/patents:
    post:
      summary: Google Patents
      operationId: patents
      requestBody: { $ref: "#/components/requestBodies/Search" }
      responses:
        "200": { $ref: "#/components/responses/PatentsOK" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/autocomplete:
    post:
      summary: Google autocomplete suggestions (0.5 credit)
      operationId: autocomplete
      requestBody: { $ref: "#/components/requestBodies/Search" }
      responses:
        "200": { $ref: "#/components/responses/AutocompleteOK" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/webpage:
    post:
      summary: Fetch any public URL (HTML or PDF) and return clean Markdown + metadata (1 credit)
      operationId: webpage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebpageRequest" }
      responses:
        "200": { $ref: "#/components/responses/WebpageOK" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/chatgpt:
    post:
      summary: Ask ChatGPT as a logged-out user and get its answer, cited sources, products and places (5 credits)
      operationId: chatgpt
      description: |
        Opens chatgpt.com as a logged-out visitor in a standard Chrome behind our
        proxies, sends `prompt` and returns the answer. With `web_search` (default
        true) ChatGPT searches the web; `false` lets it decide. ChatGPT localises
        prices, shops and places to where the visitor is: set `country` to ask from
        an exit in that country (residential proxies), or leave it out to ask from
        any of our exits. Guests get ChatGPT's default free model (`model`).
        Takes 20–90 s; failed or refused answers are free.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatGPTRequest" }
            example: { prompt: "What are the best CRMs for a 10-person startup?", track: ["hubspot.com", "Pipedrive"] }
      responses: &assistantResponses
        "200": { $ref: "#/components/responses/AssistantOK" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/gemini:
    post:
      summary: Ask Google Gemini as a logged-out user and get its answer with the sources it grounded on (5 credits)
      operationId: gemini
      description: |
        Opens gemini.google.com as a logged-out visitor and sends `prompt`. Gemini
        answers guests from residential and ISP exits only; grounded answers take
        40–90 s. `country` asks from an exit in that country.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantRequest" }
            example: { prompt: "How do heat pumps work in cold climates?" }
      responses: *assistantResponses
  /v1/copilot:
    post:
      summary: Ask Microsoft Copilot Search on Bing and get its answer, cited sources and products (3 credits)
      operationId: copilot
      description: |
        Microsoft Copilot Search (bing.com/copilotsearch, Bing's AI answer).
        The Copilot app itself has no logged-out access. `country` and `language`
        set Bing's market. Products are Bing's sponsored product cards. 15–40 s.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantRequest" }
            example: { prompt: "best mattress for side sleepers", country: us }
      responses: *assistantResponses
  /v1/ai_mode:
    post:
      summary: Ask Google AI Mode and get its answer, cited sources and products (3 credits)
      operationId: aiMode
      description: |
        Google's AI Mode (`udm=50`) for `prompt`, logged out. `country` is the
        country Google answers for. 10–45 s.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantRequest" }
            example: { prompt: "how to remove a red wine stain from a wool carpet" }
      responses: *assistantResponses
  /v1/brave_ai:
    post:
      summary: Ask Brave Search's AI answer and get it with cited sources, the searches it ran and products (2 credits)
      operationId: braveAi
      description: |
        Brave Search's AI answer ("Ask Brave") for `prompt`, logged out. `country`
        sets Brave's market (prices and shops follow it). About 10 s.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantRequest" }
            example: { prompt: "best budget noise cancelling headphones under $100" }
      responses: *assistantResponses
  /v1/extract:
    post:
      summary: Up to 20 URLs (HTML or PDF) as Markdown, text or HTML, with query-ranked highlights, links, images, an AI summary or JSON extracted with a schema (1 credit per URL read)
      operationId: extract
      description: |
        Every URL is billed only when it comes back: 1 credit, 0.5 from cache. URLs that
        fail are listed in `failed` and cost nothing. The response is `200` even when every
        URL failed. Highlights are ranked with BM25 (lexical, no model).

        **AI:** `summary: true` adds a 3–6 sentence summary of each page (+4 credits per
        page); `output_schema` (a JSON Schema, at most 16 KB, optionally guided by
        `prompt`) returns each page's data as JSON in `output` (+4 credits per page).
        Claude Haiku writes both; a schema whose fields are all booleans or enums is
        answered by a decision model instead (always valid against the schema). A
        summary or extraction that fails is reported in `summary_error` /
        `output_error` and not charged. With either, `timeout` defaults to 75 seconds
        and the last 25 are kept for the model.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtractRequest" }
            example: { urls: ["https://example.com/pricing", "https://example.com/docs/limits.pdf"], query: "enterprise price", highlights: 2 }
      responses:
        "200": { $ref: "#/components/responses/ExtractOK" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/map:
    post:
      summary: The URLs of a site, from robots.txt sitemaps and the start page's links, optionally ranked by a search (1 credit; free when nothing is found)
      operationId: map
      description: |
        Reads the sitemaps listed in robots.txt (or `/sitemap.xml`), following sitemap
        indexes; XML, gzip, RSS/Atom and plain-text sitemaps are understood. URLs are
        cleaned (fragment and tracking parameters such as `utm_*`, `gclid` and `fbclid`
        dropped), kept on the site, filtered by `include_paths` / `exclude_paths` and
        de-duplicated (`www.`, scheme and trailing slash folded). `search` ranks the URLs
        by their path words and titles (BM25) and drops the ones that don't match. Takes
        at most about 30 seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MapRequest" }
            example: { url: "https://docs.example.com/", search: "install guide", limit: 50 }
      responses:
        "200": { $ref: "#/components/responses/MapOK" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/crawl:
    post:
      summary: Start an async crawl of one site (1 credit per page read; `limit` credits reserved up front, the rest refunded)
      operationId: createCrawl
      description: |
        From `url` and (unless `sitemap: skip`) the site's sitemaps, same host (optionally
        subdomains), up to `limit` pages and `max_depth` link hops, filtered by
        `include_paths` / `exclude_paths` (regular expressions matched against the URL
        path). Breadth first, or best first with `query` (pages whose URL and link text
        match it are read first). Each host's robots.txt is honoured (RFC 9309: rules,
        `Crawl-delay`; a robots.txt that answers 5xx stops the crawl at the start page).
        URLs are canonicalised (fragments and tracking parameters dropped, `www.`,
        trailing slashes and redirects folded) so each page is read once. Each page comes
        back as Markdown (or text) with its metadata. A crawl runs for at most 30 minutes
        and returns up to 16 MB of pages; `result.stats.stopped` says why it ended.

        Returns `202` with a task; poll `GET /v1/crawl/{id}` or wait for the signed
        `crawl.completed` webhook. Pages read cost 1 credit each (0.5 from cache); a crawl
        that read nothing fails (`no_pages`) and is refunded. At most 20 crawls per account
        may be queued or running at once (`429`); a crawl interrupted by a deploy restarts
        from the beginning.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrawlRequest" }
            example: { url: "https://docs.example.com/", limit: 50, max_depth: 2, include_paths: ["^/guides/"] }
      responses:
        "202": { $ref: "#/components/responses/TaskAccepted" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/crawl/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Poll a crawl (kept for 24 hours)
      operationId: getCrawl
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrawlTask" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    delete:
      summary: Cancel a crawl. A queued crawl is canceled and refunded at once; a running one stops at its next checkpoint and is charged for the pages read
      description: "`404` when there is no such crawl, `409` when it already finished."
      operationId: cancelCrawl
      responses:
        "200": { $ref: "#/components/responses/TaskCanceled" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /v1/answer:
    post:
      summary: A cited answer grounded on live Google results, written by Claude (fast = 1 + 2 credits; standard = 1 + 1 per page read + 4)
      operationId: answer
      description: |
        Runs the query on Google, then Claude (Haiku by default) writes a concise answer
        that cites the numbered `results` with `[n]` markers. `depth=fast` answers from
        the result page (snippets, answer box, knowledge panel); `depth=standard`
        (default) also reads the top `num_sources` pages and answers from their
        query-ranked passages. Sources are untrusted: instructions inside pages are
        ignored.

        **Billing:** the search part is priced like `/v1/search` with `include_content`
        (1 credit + 1 per page read, cache rules as usual); the model adds 2 credits at
        `fast` and 4 when it read pages (`standard`; 2 if no page could be read).
        `meta.credits` splits the two. When the model fails the answer part is refunded
        (`503 ai_unavailable`); a search that returned nothing to answer from is answered
        with `answer: null`, a warning, and no model charge.

        **Structured output:** with `output_schema` (a JSON Schema, at most 16 KB) the
        answer is a JSON value in `output` (and `answer` is null). Can't be combined
        with `stream`.

        **Streaming:** `stream: true` returns `text/event-stream` with these events, in
        order: `results` (`{request, results}`), `delta` (`{text}`, repeated), then
        `done` (`{answer, citations, meta}`) or `error` (`{error}`). Billing headers on a
        stream carry the search part only; the final `meta` has the total.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnswerRequest" }
            example: { q: "what is retrieval-augmented generation", depth: standard, num_sources: 3 }
      responses:
        "200":
          description: OK (`text/event-stream` when `stream` is true)
          headers:
            X-Credits-Used: { $ref: "#/components/headers/CreditsUsed" }
            X-Credits-Remaining: { $ref: "#/components/headers/CreditsRemaining" }
            X-Cost-USD: { $ref: "#/components/headers/CostUSD" }
            X-Cache: { $ref: "#/components/headers/Cache" }
            X-Latency-Ms: { $ref: "#/components/headers/LatencyMs" }
            X-Tokens-Estimate: { $ref: "#/components/headers/TokensEstimate" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnswerResponse" }
              example:
                request: { endpoint: answer, engine: google, q: "what is retrieval-augmented generation", country: us, language: en, num: 10, page: 1, autocorrect: true, device: desktop, include_content: 3, depth: standard, num_sources: 3 }
                answer: "Retrieval-augmented generation (RAG) grounds a language model's answer in documents retrieved at query time [1], which reduces hallucinations and keeps answers current [2]."
                citations:
                  - { index: 1, title: "Retrieval-augmented generation", link: "https://en.wikipedia.org/wiki/Retrieval-augmented_generation", domain: en.wikipedia.org }
                  - { index: 2, title: "What is RAG?", link: "https://www.ibm.com/think/topics/retrieval-augmented-generation", domain: ibm.com }
                results:
                  - { index: 1, title: "Retrieval-augmented generation", link: "https://en.wikipedia.org/wiki/Retrieval-augmented_generation", domain: en.wikipedia.org }
                  - { index: 2, title: "What is RAG?", link: "https://www.ibm.com/think/topics/retrieval-augmented-generation", domain: ibm.com }
                meta:
                  request_id: req_01J9
                  credits_used: 6
                  credits: { search: 4, answer: 2 }
                  cached: false
                  engine: google
                  latency_ms: 4410
                  llm: { provider: anthropic, model: claude-haiku-5-5, input_tokens: 3120, output_tokens: 88 }
            text/event-stream:
              schema:
                type: string
                description: |
                  Server-Sent Events. Each event is `event: <name>\ndata: <JSON>\n\n`:
                  `results` → AnswerStreamResults, `delta` → AnswerStreamDelta,
                  `done` → AnswerStreamDone, `error` → Error.
              example: |
                event: results
                data: {"request":{"endpoint":"answer","q":"what is retrieval-augmented generation"},"results":[{"index":1,"title":"Retrieval-augmented generation","link":"https://en.wikipedia.org/wiki/Retrieval-augmented_generation","domain":"en.wikipedia.org"}]}

                event: delta
                data: {"text":"Retrieval-augmented generation grounds "}

                event: done
                data: {"answer":"Retrieval-augmented generation grounds a model's answer in documents retrieved at query time [1].","citations":[{"index":1,"title":"Retrieval-augmented generation","link":"https://en.wikipedia.org/wiki/Retrieval-augmented_generation","domain":"en.wikipedia.org"}],"meta":{"request_id":"req_01J9","credits_used":3,"cached":false}}
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/research:
    post:
      summary: Start an async deep-research task — planned searches, page reading, a cited Markdown report written by Claude (lite 30, standard 75, deep 200 credits)
      operationId: createResearch
      description: |
        Claude plans Google queries for `input`, the pages they find are read and
        ranked, a decision model checks whether the notes already cover the task (and
        drops off-topic sources), Claude reviews gaps and plans follow-up rounds, then
        writes a Markdown report citing numbered sources (and, with `output_schema`, a
        JSON value in `output`).

        | effort | credits | first-round queries | rounds | pages per query |
        |---|---:|---:|---:|---:|
        | lite | 30 | 3 | 1 | 2 |
        | standard | 75 | 5 | 2 | 3 |
        | deep | 200 | 8 | 3 | 4 |

        The flat price is reserved at enqueue and charged only when the report is
        written; failed research is refunded. A canceled task is charged 1 credit per
        search already run. Returns `202`; poll `GET /v1/research/{id}` or wait for the
        signed `research.completed` webhook. At most 20 crawl and research tasks per
        account may be queued or running at once (`429`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResearchRequest" }
            example: { input: "compare espresso machines under $500 for a small office", effort: standard, output_schema: { type: object, properties: { winner: { type: string } } } }
      responses:
        "202": { $ref: "#/components/responses/TaskAccepted" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/research/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Poll a research task (kept for 24 hours)
      operationId: getResearch
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchTask" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    delete:
      summary: Cancel a research task. A queued task is refunded at once; a running one stops at its next round and is charged for the searches run
      description: "`404` when there is no such task, `409` when it already finished."
      operationId: cancelResearch
      responses:
        "200": { $ref: "#/components/responses/TaskCanceled" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /v1/monitors:
    post:
      summary: Create a monitor — a saved /v1/search or /v1/news request (new results) or a /v1/webpage URL (content changes) that runs on a schedule and reports what is new (signed webhook and run history)
      operationId: createMonitor
      description: |
        Runs hourly to monthly (`interval` or `interval_seconds`, default daily); the
        first run is due right away (unless `active: false`). With `endpoint: webpage`
        the monitor watches `url` and reports the page (Markdown, `change: new|changed`)
        whenever its content changes (1 credit per check). Each run is billed like the
        search it makes (1 credit per 10 results, `num: 100` is 7; empty and failed runs
        are free) on the monitor's key: the key that created it, or last changed or ran
        it, under that key's limits and the account's spend cap. Only the fields below
        are kept; any other search field is a `400`. Results among the
        top `num` not seen in earlier runs are POSTed as a `monitor.results` webhook when
        the monitor has a `webhook_url`, and are always listed in its run history
        (`GET /v1/monitors/{id}/runs`, results kept 24 hours). At most 100 monitors per
        account (403 `forbidden`). A monitor pauses itself after 10 failed runs in a row
        (search errors, insufficient credits or webhook failures) or when its key is
        revoked; set `active: true` to resume.

        With an AI assistant `endpoint` (chatgpt, gemini, copilot, ai_mode,
        brave_ai) the monitor asks `prompt` every run and reports every answer
        (AI visibility is tracked over time): `text`, `markdown`, `sources`,
        `new_sources` (links not seen in earlier runs), `search_queries`,
        `products` and, with `track`, `mentions`. Each run costs the endpoint's
        price.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitorCreateRequest" }
            example: { q: "ai agents", endpoint: news, interval: hourly, name: "agents news", webhook_url: "https://example.com/hooks/serpkite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monitor" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    get:
      summary: List the account's monitors
      operationId: listMonitors
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitorList" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/monitors/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Get a monitor
      operationId: getMonitor
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monitor" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    patch:
