      properties:
        request: { $ref: "#/components/schemas/RequestEcho" }
        results: { type: array, items: { $ref: "#/components/schemas/Suggestion" } }
        meta: { $ref: "#/components/schemas/Meta" }

    PageMetadata:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        language: { type: string }
        canonical: { type: string }
        site_name: { type: string }
        image: { type: string }
        published_time: { type: string }
        author: { type: string }
        content_type: { type: string, description: The page's media type, examples: [text/html, application/pdf] }
        pages: { type: integer, description: Page count of a PDF }
    PageLink:
      type: object
      required: [url]
      properties:
        url: { type: string, description: Absolute URL }
        text: { type: string, description: Anchor text }
    WebpageResponse:
      type: object
      required: [request, url, markdown, metadata, meta]
      properties:
        request: { $ref: "#/components/schemas/RequestEcho" }
        url: { type: string, description: Final URL after redirects }
        status_code: { type: integer }
        markdown: { type: string }
        text: { type: string }
        html: { type: string, description: Only with include_html=true }
        metadata: { $ref: "#/components/schemas/PageMetadata" }
        links: { type: array, items: { $ref: "#/components/schemas/PageLink" }, description: "include_links=true only. Outbound links in document order, deduplicated" }
        image_links: { type: array, items: { type: string }, description: include_images=true only. Image URLs in document order }
        meta: { $ref: "#/components/schemas/Meta" }

    CSEResponse:
      type: object
      required: [kind, searchInformation, items]
      properties:
        kind: { type: string, const: customsearch#search }
        url: { type: object }
        queries: { type: object, additionalProperties: true }
        context: { type: object }
        searchInformation:
          type: object
          properties:
            searchTime: { type: number }
            formattedSearchTime: { type: string }
            totalResults: { type: string }
            formattedTotalResults: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, const: customsearch#result }
              title: { type: string }
              htmlTitle: { type: string }
              link: { type: string }
              displayLink: { type: string }
              snippet: { type: string }
              htmlSnippet: { type: string }
              formattedUrl: { type: string }
              htmlFormattedUrl: { type: string }
              pagemap: { type: object, additionalProperties: true }
              image: { type: object, additionalProperties: true }

    RankRequest:
      type: object
      required: [q, domain]
      properties:
        q: { type: string }
        domain: { type: string, description: 'Domain to find, e.g. "example.com" (subdomains match)' }
        num: { type: integer, enum: [10, 20, 30, 50, 100], default: 100 }
        country: { type: string }
        language: { type: string }
        location: { type: string }
        device: { type: string, enum: [desktop, mobile] }
        max_age: { type: integer }
    RankResponse:
      type: object
      required: [request, domain, position, matches, checked, meta]
      properties:
        request: { $ref: "#/components/schemas/RequestEcho" }
        domain: { type: string }
        position: { type: [integer, "null"], description: Best organic position, null when not in the checked results }
        matches:
          type: array
          items:
            type: object
            required: [position, title, link]
            properties:
              position: { type: integer }
              title: { type: string }
              link: { type: string }
        checked: { type: integer, description: Organic results inspected }
        meta: { $ref: "#/components/schemas/Meta" }

    Status:
      type: object
      required: [status, window_minutes, endpoints, updated_at]
      properties:
        status: { type: string, enum: [operational, degraded] }
        window_minutes: { type: integer }
        updated_at: { type: string, format: date-time }
        endpoints:
          type: array
          items:
            type: object
            required: [endpoint, requests, success_rate, p50_ms, p95_ms]
            properties:
              endpoint: { type: string }
              requests: { type: integer }
              success_rate: { type: number, description: Share of requests without a 5xx (0-1) }
              p50_ms: { type: integer, description: Median latency of successful (non-error) responses; 0 when none succeeded }
              p95_ms: { type: integer, description: 95th-percentile latency of successful (non-error) responses; 0 when none succeeded }

    BatchCreateRequest:
      type: object
      required: [endpoint, requests]
      properties:
        endpoint:
          type: string
          enum: [search, images, videos, news, maps, places, reviews, shopping, scholar, patents, autocomplete, webpage]
        requests:
          type: array
          minItems: 1
          maxItems: 100
          description: Request bodies for `endpoint` (same fields as the realtime endpoint)
          items: { type: object, additionalProperties: true }
        webhook_url: { type: string, format: uri, description: "POSTed each job's result, always signed with X-SerpKite-Signature (v1=hex HMAC-SHA256 of `<timestamp>.<body>` with the account webhook secret; see createBatches). Defaults to the account webhook" }
    BatchCreateResponse:
      type: object
      required: [batches]
      properties:
        batches:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/Batch"
              - $ref: "#/components/schemas/Error"

    Batch:
      type: object
      required: [id, status, endpoint, created_at, poll_url]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, done, failed] }
        endpoint: { type: string, examples: [/v1/search] }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        credits_used: { type: number }
        poll_url: { type: string }
        webhook_url: { type: [string, "null"] }
        webhook_status: { type: [string, "null"], enum: [pending, delivered, failed, null] }
        error: { type: [object, "null"], properties: { code: { type: string }, message: { type: string } } }
        result: { type: [object, "null"], additionalProperties: true, description: "Present when done; kept 24h. The endpoint's response body, or {markdown, meta} for format=markdown jobs" }

    Account:
      type: object
      required: [balance, rate_limit_rps, plan, month]
      properties:
        balance: { type: number, description: "Negative after a refund of credits that were already spent; requests then get 402 insufficient_credits" }
        rate_limit_rps: { type: integer }
        plan: { type: string, enum: [free, paid] }
        key: { type: object, properties: { id: { type: string }, name: { type: string }, credit_limit: { type: [number, "null"] }, credits_used_month: { type: number } } }
        monthly_spend_cap: { type: [number, "null"] }
        month:
          type: object
          required: [credits, requests]
          properties:
            credits: { type: number }
            requests: { type: integer }

    TaskCompletedEvent:
      type: object
      description: "Body of `crawl.completed`"
      required: [event, id, kind, status, created_at, credits_used]
      properties:
        event: { type: string, const: crawl.completed }
        id: { type: string, format: uuid }
        kind: { type: string, const: crawl }
        status: { $ref: "#/components/schemas/TaskStatus" }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        credits_used: { type: number }
        poll_url: { type: string, description: Where the task (and its full result) can be fetched for 24 hours }
        result: { description: "The CrawlResult (null when the crawl failed without one, or when it is larger than 4 MB: see result_omitted)" }
        result_omitted: { type: boolean, description: "Set when the result was too large for the webhook; GET poll_url for it" }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

    MonitorSearch:
      type: object
      description: "The saved request a monitor reruns: a search (q and options) or, for webpage monitors, url (and country)"
      properties:
        q: { type: string }
        url: { type: string }
        country: { type: string }
        language: { type: string }
        location: { type: string }
        time: { type: string, enum: [hour, day, week, month, year] }
        num: { type: integer }
        device: { type: string }
        safe: { type: string }
        include_domains: { type: array, items: { type: string } }
        exclude_domains: { type: array, items: { type: string } }
        engine: { type: array, items: { type: string } }

    MonitorCreateRequest:
      type: object
      description: "Search and news monitors need `q`; webpage monitors need `url` and take only `country` besides"
      properties:
        q: { type: string, minLength: 1, maxLength: 2048 }
        url: { type: string, format: uri, description: "endpoint=webpage: the page to watch for content changes" }
        endpoint: { type: string, enum: [search, news, webpage], default: search }
        metadata: { type: object, additionalProperties: true, description: "Your own JSON object (at most 2 KB), echoed on the monitor and in its webhooks" }
        name: { type: string, maxLength: 200 }
        interval: { type: string, enum: [hourly, daily, weekly], default: daily }
        interval_seconds: { type: integer, minimum: 3600, maximum: 2592000, description: Overrides interval }
        webhook_url: { type: string, format: uri, description: "Receives signed `monitor.results` events. Without one, read new results from the run history" }
        active: { type: boolean, default: true, description: "false creates the monitor paused" }
        country: { type: string }
        language: { type: string }
        location: { type: string }
        time: { type: string, enum: [hour, day, week, month, year] }
        num: { type: integer, minimum: 1, maximum: 100 }
        device: { type: string, enum: [desktop, mobile] }
        safe: { type: string, enum: [active, off] }
        include_domains: { $ref: "#/components/schemas/DomainList" }
        exclude_domains: { $ref: "#/components/schemas/DomainList" }
        engine: { $ref: "#/components/schemas/EngineParam" }

    MonitorUpdateRequest:
      type: object
      description: Only the fields sent change. Search fields are merged into the saved search; a changed search (or endpoint) makes the next run report every result as new.
      properties:
        name: { type: string, maxLength: 200 }
        interval: { type: string, enum: [hourly, daily, weekly] }
        interval_seconds: { type: integer, minimum: 3600, maximum: 2592000 }
        webhook_url: { type: string, description: "A webhook URL, or an empty string to remove it" }
        active: { type: boolean, description: "true resumes a paused monitor (due now, failure streak cleared)" }
        metadata: { type: [object, "null"], additionalProperties: true, description: Replaces the metadata (null clears it) }
        endpoint: { type: string, enum: [search, news, webpage], description: "Switching between a search and a page drops the other kind's fields" }
        q: { type: string, minLength: 1, maxLength: 2048 }
        url: { type: string, format: uri, description: endpoint=webpage only }
        country: { type: string }
        language: { type: string }
        location: { type: string }
        time: { type: string, enum: [hour, day, week, month, year] }
        num: { type: integer, minimum: 1, maximum: 100 }
        device: { type: string, enum: [desktop, mobile] }
        safe: { type: string, enum: [active, off] }
        include_domains: { $ref: "#/components/schemas/DomainList" }
        exclude_domains: { $ref: "#/components/schemas/DomainList" }
        engine: { $ref: "#/components/schemas/EngineParam" }

    Monitor:
      type: object
      required: [id, name, endpoint, request, interval_seconds, webhook_url, active, next_run_at, runs, consecutive_failures, credits_used, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        endpoint: { type: string, enum: [search, news, webpage] }
        request: { $ref: "#/components/schemas/MonitorSearch" }
        metadata: { type: [object, "null"], additionalProperties: true }
        interval_seconds: { type: integer }
        webhook_url: { type: [string, "null"], description: Null when new results are only kept in the run history }
        active: { type: boolean }
        next_run_at: { type: string, format: date-time }
        last_run_at: { type: [string, "null"], format: date-time }
        last_status: { type: [string, "null"], enum: [ok, error, webhook_failed, paused, null] }
        last_error: { type: [string, "null"] }
        last_new_results: { type: integer, description: New results found by the last run }
        runs: { type: integer }
        consecutive_failures: { type: integer, description: Failed runs in a row; the monitor pauses itself at 10 }
        credits_used: { type: number, description: Total over all runs }
        created_at: { type: string, format: date-time }

    MonitorRun:
      type: object
      required: [id, status, new_results, credits_used, created_at]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [ok, error, webhook_failed, paused] }
        error: { type: [string, "null"] }
        new_results: { type: integer }
        results:
          type: [array, "null"]
          description: The new results (OrganicResult-shaped for search, NewsResult for news, MonitorPageChange for webpage); null when there were none or after 24 hours
          items: { type: object, additionalProperties: true }
        credits_used: { type: number }
        webhook_status: { type: [string, "null"], enum: [delivered, failed, none, null], description: "none = the monitor has no webhook; null = nothing to send" }
        created_at: { type: string, format: date-time }

    MonitorPageChange:
      type: object
      description: What a webpage monitor reports when the page is new to it or its content changed
      required: [url, change, content_hash, markdown]
      properties:
        url: { type: string, description: Final URL after redirects }
        title: { type: string }
        change: { type: string, enum: [new, changed] }
        content_hash: { type: string, description: Fingerprint of the content (whitespace-insensitive) }
        markdown: { type: string, description: The page's Markdown (up to about 8,000 tokens) }
        published_at: { type: string }

    MonitorRunList:
      type: object
      required: [results, next_before]
      properties:
        results: { type: array, items: { $ref: "#/components/schemas/MonitorRun" } }
        next_before: { type: [string, "null"], format: uuid, description: Pass as `before` for the next page; null on the last page }

    MonitorList:
      type: object
      required: [results]
      properties:
        results: { type: array, items: { $ref: "#/components/schemas/Monitor" } }

    MonitorResultsEvent:
      type: object
      description: "Body of `monitor.results`"
      required: [event, monitor_id, run_id, name, endpoint, q, first_run, run_at, new_results, credits_used]
      properties:
        event: { type: string, const: monitor.results }
        monitor_id: { type: string, format: uuid }
        run_id: { type: string, format: uuid, description: Also the X-SerpKite-Delivery header; use it to deduplicate retries }
        name: { type: string }
        endpoint: { type: string, enum: [search, news, webpage] }
        q: { type: string, description: The saved query (empty for webpage monitors) }
        url: { type: string, description: webpage monitors only }
        metadata: { type: [object, "null"], additionalProperties: true, description: The monitor's metadata }
        first_run: { type: boolean, description: The first run since the monitor was created or its search changed }
        run_at: { type: string, format: date-time }
        new_results:
          type: array
          description: Results not seen in earlier runs (OrganicResult-shaped for search, NewsResult for news, MonitorPageChange for webpage)
          items: { type: object, additionalProperties: true }
        credits_used: { type: number, description: This run's price }
